<html lang="pt-br">
<head>

    <title>youtube</title>
    <style>
        body{
            background-color: rgb(0, 0, 0);
            
        }

        iframe{
            position: fixed;
            top: -1px;
            left: 2px;
            height: 200px;
            width: 267px;   
        }

        footer{
            position: fixed;
            top: -200px;
            left: 2px;
            height: 272px;
            width: 267px;
            padding-top: 450px;
            text-align: center;
        }

        a{
            padding: 10px;

            color: aliceblue;

        }

        a:hover{
            border: rgb(145, 16, 16) solid 3px;
            border-radius: 30px;
            box-shadow: 4px 4 px 8px rgba(0, 0, 0, 0.589);
        }

</head>
<body>
    <footer><a href="https://www.youtube.com/watch?v=ux3QETpLcPs" target="_blank">acessar no youtube</a></footer>
